<!DOCTYPE html>
<html lang="de">
<head><meta charset="UTF-8"><title>Icons generieren</title>
<style>body{font-family:sans-serif;padding:20px;background:#111;color:#eee;}button{margin:8px;padding:10px 18px;background:#FFD60A;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:700;}</style>
</head>
<body>
<h2>Findly PNG-Icons generieren</h2>
<p>Klicke die Buttons um icon-192.png und icon-512.png zu erzeugen und herunterzuladen.</p>
<button onclick="gen(192)">icon-192.png herunterladen</button>
<button onclick="gen(512)">icon-512.png herunterladen</button>
<canvas id="c" style="display:none"></canvas>
<script>
const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0A0A0A"/>
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#FFD60A"/>
  <polygon points="42,35 36,45.4 24,45.4 18,35 24,24.6 36,24.6" fill="#3D3200"/>
  <polygon points="42,55.8 36,66.2 24,66.2 18,55.8 24,45.4 36,45.4" fill="#3D3200"/>
  <polygon points="60,45.4 54,55.8 42,55.8 36,45.4 42,35 54,35" fill="#3D3200"/>
  <ellipse cx="68" cy="41" rx="9.5" ry="5.5" fill="white" fill-opacity="0.72" transform="rotate(-25,68,41)"/>
  <ellipse cx="86" cy="41" rx="9.5" ry="5.5" fill="white" fill-opacity="0.72" transform="rotate(25,86,41)"/>
  <line x1="74" y1="38" x2="69" y2="30" stroke="#1A1000" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="80" y1="38" x2="85" y2="30" stroke="#1A1000" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="69" cy="29" r="2.5" fill="#1A1000"/>
  <circle cx="85" cy="29" r="2.5" fill="#1A1000"/>
  <circle cx="77" cy="43" r="5.5" fill="#1A1000"/>
  <ellipse cx="77" cy="51" rx="5.5" ry="5" fill="#1A1000"/>
  <ellipse cx="77" cy="58" rx="6.5" ry="5" fill="#FFD60A"/>
  <ellipse cx="77" cy="65" rx="6" ry="4.5" fill="#1A1000"/>
  <ellipse cx="77" cy="71" rx="4.5" ry="3.5" fill="#FFD60A"/>
</svg>`;

function gen(size) {
  const canvas = document.getElementById('c');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(img, 0, 0, size, size);
    const a = document.createElement('a');
    a.download = `icon-${size}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(SVG)));
}
</script>
</body>
</html>
